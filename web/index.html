    <div class="app-shell">
      <header class="app-topbar">
        <div class="window-controls">
          <button class="window-nav" aria-label="切换侧栏" aria-controls="conversation-sidebar">
            <svg class="ui-icon"><use href="#i-layout" /></svg></button
          ><button class="window-nav" aria-label="后退">
            <svg class="ui-icon" aria-hidden="true"><use href="#i-chevron-left" /></svg></button
          ><button class="window-nav disabled" aria-label="前进" disabled>
            <svg class="ui-icon" aria-hidden="true"><use href="#i-chevron-right" /></svg>
          </button>
        </div>
        <div class="topbar-context">
          <svg class="ui-icon context-icon"><use href="#i-folder" /></svg
          ><span id="project-context" hidden></span><strong id="topbar-task">新任务</strong>
          <button
            class="topbar-button square"
            id="session-menu-button"
            type="button"
            title="会话菜单"
            aria-label="会话菜单"
            aria-haspopup="menu"
            aria-controls="session-menu"
            aria-expanded="false"
            hidden
          >
            <svg class="ui-icon" aria-hidden="true"><use href="#i-more" /></svg>
          </button>
          <div id="connection-state" role="status" hidden></div>
          <span id="workspace-path" hidden>Connected</span>
        </div>
        <div class="topbar-actions">
          <button
            class="topbar-button square"
            id="output-pane-toggle"
            type="button"
            title="切换任务面板"
            aria-label="切换任务面板"
            aria-controls="agent-pane"
            aria-expanded="false"
          >
            <svg class="ui-icon" aria-hidden="true"><use href="#i-layout" /></svg>
          </button>
        </div>
      </header>

      <div class="app-layout">
        <aside class="conversation-sidebar" id="conversation-sidebar">
          <div class="sidebar-header">
            <div class="brand-lockup">
              <div class="brand-mark"><img src="/assets/atria-symbol.png" alt="CoworkOS" /></div>
              <strong>CoworkOS</strong>
            </div>
            <div class="sidebar-header-actions">
              <button
                class="sidebar-icon sidebar-view-toggle sidebar-view-toggle-compact"
                data-sidebar-view="tasks"
                title="显示任务面板"
                aria-label="显示任务面板"
                aria-controls="agent-pane"
                hidden
              >
                <svg class="ui-icon" aria-hidden="true"><use href="#i-switch" /></svg>
              </button>
              <button
                class="sidebar-icon"
                title="搜索"
                aria-label="搜索"
                aria-haspopup="dialog"
                aria-keyshortcuts="Control+P Meta+P"
              >
                <svg class="ui-icon"><use href="#i-search" /></svg></button
              ><button class="sidebar-icon" title="任务动态" aria-label="任务动态">
                <svg class="ui-icon"><use href="#i-bell" /></svg>
              </button>
            </div>
          </div>
          <div class="sidebar-top">
            <button class="new-conversation" id="new-conversation" disabled>
              <span class="new-icon"
                ><svg class="ui-icon"><use href="#i-arrow" /></svg></span
              ><span>新对话</span><span class="shortcut">⌘ K</span>
            </button>
          </div>
          <nav class="sidebar-nav">
            <button class="nav-item active">
              <span class="nav-icon"
                ><svg class="ui-icon"><use href="#i-grid" /></svg></span
              >工作台</button
            ><button
              class="nav-item"
              id="apps-nav"
              type="button"
              aria-expanded="false"
              aria-controls="apps-panel"
              hidden
            >
              <span class="nav-icon"
                ><svg class="ui-icon"><use href="#i-apps" /></svg></span
              >应用<span class="nav-chevron"
                ><svg class="ui-icon" aria-hidden="true"><use href="#i-chevron-down" /></svg
              ></span>
            </button>
            <div class="apps-panel" id="apps-panel" hidden></div>
            <button class="nav-item" id="goals-nav" type="button" aria-current="false">
              <span class="nav-icon"
                ><svg class="ui-icon" aria-hidden="true"><use href="#i-bell" /></svg></span
              ><span>长期任务</span><span id="goals-unread" class="goal-unread" hidden></span>
            </button>
          </nav>
          <div class="sidebar-section-label">
            <span>项目 <span id="conversation-count" hidden>0</span></span
            ><button id="new-project" type="button" aria-label="新建项目" title="新建项目">
              <svg class="ui-icon"><use href="#i-plus" /></svg>
            </button>
          </div>
          <div class="project-list" id="project-list" aria-label="项目与对话列表"></div>
          <div class="sidebar-bottom">
            <button
              class="account-row"
              id="user-menu-button"
              aria-label="设置"
              aria-haspopup="dialog"
              aria-controls="profile-modal"
            >
              <svg class="ui-icon account-icon" aria-hidden="true"><use href="#i-sliders" /></svg
              ><span class="account-name">设置</span
              ><span class="account-more"
                ><svg class="ui-icon" aria-hidden="true"><use href="#i-chevron-right" /></svg
              ></span>
            </button>
          </div>
        </aside>

        <div
          class="sidebar-divider"
          id="sidebar-divider"
          role="separator"
          tabindex="0"
          aria-label="调整会话侧栏宽度"
          aria-orientation="vertical"
          title="拖动调整侧栏宽度，双击恢复默认"
        ></div>
        <main class="chat-pane">
          <div id="workbench" class="workbench" hidden>
            <div
              class="workbench-header"
              data-workbench-header
              aria-describedby="workbench-session-status"
              hidden
            >
              <nav class="workbench-rail" data-tab-rail aria-label="打开的文件与应用" hidden></nav>
              <span id="workbench-session-status" class="sr-only" data-app-task-status role="status"></span>
              <div class="workbench-view-actions">
                <button class="app-button" data-app-expand aria-label="全屏编辑" title="全屏编辑">
                  <svg class="ui-icon" aria-hidden="true"><use href="#i-fit" /></svg>
                </button>
                <button
                  class="app-button"
                  data-app-collaborate
                  aria-label="在对话中使用"
                  title="在对话中使用"
                >
                  <svg class="ui-icon" aria-hidden="true"><use href="#i-chat" /></svg>
                </button>
              </div>
            </div>
            <div class="workbench-tabs" data-tab-strip role="tablist" aria-label="工作台标签"></div>
          </div>
          <div
            class="workspace-divider"
            data-workspace-divider
            role="separator"
            aria-label="调整对话与工作台宽度"
            aria-orientation="vertical"
            tabindex="0"
            hidden
          ></div>
          <div id="conversation-pane" class="conversation-pane">
            <section class="chat-scroll" id="conversation">
              <div class="welcome-empty">
                <div class="welcome-symbol"><img src="/assets/atria-symbol.png" alt="" /></div>
                <h2>有什么可以帮忙的？</h2>
                <p>描述目标，或先打开应用准备文档。连接模型并选择项目后，即可开始协作。</p>
                <div class="starter-prompts">
                  <button data-prompt="帮我梳理这个项目的结构">
                    <span class="prompt-icon"
                      ><svg class="ui-icon" aria-hidden="true"><use href="#i-folder" /></svg></span
                    >梳理项目结构
                    <span class="prompt-arrow"
                      ><svg class="ui-icon" aria-hidden="true"><use href="#i-arrow" /></svg
                    ></span></button
                  ><button data-prompt="检查最近的代码改动并运行测试">
                    <span class="prompt-icon"
                      ><svg class="ui-icon" aria-hidden="true"><use href="#i-check" /></svg></span
                    >检查代码改动
                    <span class="prompt-arrow"
                      ><svg class="ui-icon" aria-hidden="true"><use href="#i-arrow" /></svg
                    ></span></button
                  ><button data-prompt="研究这个主题并整理一份简报">
                    <span class="prompt-icon"
                      ><svg class="ui-icon" aria-hidden="true"><use href="#i-search" /></svg></span
                    >研究并整理简报
                    <span class="prompt-arrow"
                      ><svg class="ui-icon" aria-hidden="true"><use href="#i-arrow" /></svg
                    ></span>
                  </button>
                  <button data-prompt="读取我提供的文件，整理关键信息并生成一份报告。">
                    <span class="prompt-icon"
                      ><svg class="ui-icon" aria-hidden="true"><use href="#i-apps" /></svg
                    ></span>
                    整理文件并生成报告
                    <span class="prompt-arrow"
                      ><svg class="ui-icon" aria-hidden="true"><use href="#i-arrow" /></svg
                    ></span>
                  </button>
                </div>
              </div>
            </section>
            <div class="composer-wrap">
              <section
                id="human-questions"
                class="human-questions"
                aria-label="需要你的回复"
                hidden
              ></section>
              <div class="composer">
                <div id="queued-messages" class="queued-messages" aria-label="排队消息" hidden></div>
                <button class="composer-context" data-composer-context type="button" hidden></button>
                <textarea
                  id="composer-input"
                  rows="3"
                  aria-label="任务描述"
                  placeholder="描述任务，或添加后续要求…"
                ></textarea>
                <div id="upload-status" class="upload-status" role="status" hidden></div>
                <div id="attachment-strip" class="attachment-strip" hidden></div>
                <div class="composer-bar">
                  <div class="composer-left">
                    <button
                      class="attach-button"
                      title="添加文件 · 支持图片、PDF、Office，也可拖拽或粘贴截图"
                      aria-label="添加文件"
                    >
                      <svg class="ui-icon"><use href="#i-plus" /></svg>
                    </button>
                    <button id="model-setup-button" type="button" hidden>连接模型</button>
                    <button
                      class="model-select"
                      id="model-select"
                      type="button"
                      title="切换模型"
                      aria-haspopup="listbox"
                      aria-expanded="false"
                    >
                      <span class="model-logo"><img src="/assets/atria-symbol.png" alt="" /></span
                      ><span class="model-name">CoworkOS Main</span
                      ><span class="model-chevron"
                        ><svg class="ui-icon" aria-hidden="true"><use href="#i-chevron-down" /></svg
                      ></span>
                    </button>
                    <button
                      class="reasoning-select"
                      id="reasoning-select"
                      type="button"
                      title="设置推理强度"
                      aria-label="推理强度：自动"
                      aria-haspopup="listbox"
                      aria-expanded="false"
                    >
                      <span class="reasoning-name">自动</span
                      ><span class="model-chevron"
                        ><svg class="ui-icon" aria-hidden="true"><use href="#i-chevron-down" /></svg
                      ></span>
                    </button>
                  </div>
                  <div class="composer-right">
                    <button
                      class="app-bind-select"
                      id="app-bind-select"
                      type="button"
                      title="指定本轮对话加载的应用"
                      aria-label="加载应用"
                      aria-haspopup="listbox"
                      aria-expanded="false"
                      hidden
                    >
                      <span class="app-bind-icon"
                        ><svg class="ui-icon"><use href="#i-apps" /></svg></span
                      ><span class="app-bind-name">未加载应用</span
                      ><span class="model-chevron"
                        ><svg class="ui-icon" aria-hidden="true"><use href="#i-chevron-down" /></svg
                      ></span>
                    </button>
                    <button class="mic-button" title="语音输入" aria-label="语音输入">
                      <svg class="ui-icon"><use href="#i-mic" /></svg>
                    </button>
                    <button
                      id="stop-button"
                      class="stop-button"
                      type="button"
                      aria-label="停止任务"
                      title="停止任务"
                      hidden
                    >
                      <svg class="ui-icon" aria-hidden="true"><use href="#i-stop" /></svg>
                    </button>
                    <button id="send-button" class="send-button" aria-label="发送">
                      <svg class="ui-icon"><use href="#i-send" /></svg>
                    </button>
                  </div>
                  <div class="model-menu" id="model-menu" role="listbox" aria-label="可用模型" hidden></div>
                  <div
                    class="model-menu reasoning-menu"
                    id="reasoning-menu"
                    role="listbox"
                    aria-label="推理强度"
                    hidden
                  ></div>
                  <div
                    class="model-menu app-bind-menu"
                    id="app-bind-menu"
                    role="listbox"
                    aria-label="可加载的应用"
                    hidden
                  ></div>
                </div>
              </div>
            </div>
          </div>
        </main>

        <aside class="agent-pane" id="agent-pane" aria-label="任务工作空间">
          <div class="agent-pane-header">
            <div class="output-heading">
              <h2 id="panel-heading" tabindex="-1" aria-label="任务面板">
                <span data-panel-title>任务面板</span>
                <button
                  class="sidebar-view-toggle"
                  data-sidebar-view="navigation"
                  title="显示默认侧栏"
                  aria-label="显示默认侧栏"
                  aria-controls="conversation-sidebar"
                  hidden
                >
                  <span>任务面板</span>
                  <svg class="ui-icon" aria-hidden="true"><use href="#i-switch" /></svg>
                </button>
              </h2>
              <span id="agent-count" hidden>0</span
              ><button class="panel-add" aria-label="刷新任务面板" title="刷新">
                <svg class="ui-icon"><use href="#i-refresh" /></svg>
              </button>
            </div>
          </div>
          <div id="workspace-view" class="panel-view workspace-view">
            <div class="workspace-start">
              <strong>从一个任务或文档开始</strong>
              <p>先在输入框准备任务，或打开应用编辑文档。运行任务前，连接模型并选择项目文件夹。</p>
              <small>开始协作后，这里会显示产出物、运行用量和智能体团队。</small>
            </div>
            <div class="output-section">
              <div class="output-section-title">
                <span>产出物</span><span id="workspace-artifact-count">0</span>
              </div>
              <div class="output-list" id="output-list"></div>
            </div>
            <div class="detail-heading" id="detail-heading">
              <span>会话运行概览</span><span id="run-statistics-status"></span>
            </div>
            <div class="right-body" id="detail-body"></div>
            <section id="team-view" class="team-section" aria-labelledby="team-heading">
              <h3 class="output-section-title" id="team-heading">智能体团队</h3>
              <div
                class="agent-galaxy"
                id="agent-galaxy"
                role="group"
                aria-label="智能体星系，点击星体查看执行轨迹"
              ></div>
              <div class="team-summary">
                <div>
                  <span class="team-status-dot" id="team-status-dot"></span
                  ><strong id="team-caption-text">空闲中</strong
                  ><small id="team-count-label">等待新任务</small>
                </div>
              </div>
              <div class="member-history">
                <span>成员记录</span>
                <div id="team-members" aria-label="查看成员轨迹"></div>
              </div>
              <details id="team-trace-details" class="team-trace-details">
                <summary>查看执行轨迹<span>⌄</span></summary>
                <section class="team-trace" id="agent-focus" aria-label="智能体执行轨迹"></section>
              </details>
            </section>
            <section id="monitor-section" class="watch-section" aria-label="本会话的监控" hidden>
              <button id="monitor-manage" class="watch-session-link" type="button" aria-haspopup="dialog">
                <svg class="ui-icon" aria-hidden="true"><use href="#i-bell" /></svg>
                <span id="monitor-label">监控</span><span id="monitor-count"></span>
                <svg class="ui-icon" aria-hidden="true"><use href="#i-chevron-right" /></svg>
              </button>
            </section>
          </div>
        </aside>
      </div>
    </div>
    <div id="artifact-drawer-scrim" class="artifact-drawer-scrim" hidden></div>
    <aside id="artifact-drawer" class="artifact-drawer" aria-label="产出物详情" hidden></aside>
    <input
      id="file-input"
      type="file"
      accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.docx,.pptx,.xlsx,.txt,.md,.markdown,.csv,.tsv,.json,.jsonl,.yaml,.yml,.xml,.html,.css,.js,.mjs,.cjs,.ts,.tsx,.jsx,.py,.sh,.sql,.log,.ini,.toml,.tex,.svg"
      multiple
      hidden
    />
    <div class="modal-backdrop settings-backdrop" id="profile-modal" hidden>
      <section
        class="modal-card profile-card settings-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="profile-modal-title"
      >
        <header class="settings-heading">
          <div>
            <h2 id="profile-modal-title">设置</h2>
          </div>
          <button
            class="settings-nav-button"
            type="button"
            id="profile-close"
            aria-label="关闭设置"
            title="关闭设置"
          >
            <svg class="ui-icon" aria-hidden="true"><use href="#i-close" /></svg>
          </button>
        </header>
        <div class="settings-scroll settings-overview" id="profile-settings-sections">
          <section class="settings-overview-group" aria-labelledby="settings-general-heading">
            <h3 id="settings-general-heading">通用</h3>
            <div class="settings-overview-rows" id="profile-settings-general">
              <div class="profile-setting appearance-setting">
                <span class="settings-row-copy"
                  ><span class="settings-row-icon"
                    ><svg class="ui-icon" aria-hidden="true"><use href="#i-layout" /></svg></span
                  ><span><label for="appearance-select">外观</label></span></span
                >
                <select id="appearance-select" aria-describedby="appearance-status">
                  <option value="system">跟随系统</option>
                  <option value="dark">深色</option>
                  <option value="light">浅色</option>
                </select>
                <span id="appearance-status" role="status"></span>
              </div>
              <div class="profile-setting appearance-setting">
                <span class="settings-row-copy"
                  ><span class="settings-row-icon"
                    ><svg class="ui-icon" aria-hidden="true"><use href="#i-text" /></svg></span
                  ><span><label for="language-select">语言</label></span></span
                >
                <select id="language-select" aria-describedby="language-status">
                  <option value="zh-CN" lang="zh-CN">简体中文</option>
                  <option value="en" lang="en">English</option>
                </select>
                <span id="language-status" role="status"></span>
              </div>
            </div>
          </section>
          <section class="settings-overview-group" aria-labelledby="settings-connections-heading">
            <h3 id="settings-connections-heading">连接</h3>
            <div class="settings-overview-rows" id="profile-settings-connections"></div>
          </section>
          <section class="settings-overview-group" aria-labelledby="settings-tools-heading">
            <h3 id="settings-tools-heading">工具</h3>
            <div class="settings-overview-rows" id="profile-settings-tools"></div>
          </section>
          <section
            class="settings-overview-group"
            id="settings-about-group"
            aria-labelledby="settings-about-heading"
            hidden
          >
            <h3 id="settings-about-heading">关于</h3>
            <div class="settings-overview-rows" id="profile-settings-about"></div>
          </section>
        </div>
      </section>
    </div>
    <div class="session-menu" id="session-menu" hidden></div>
    <div class="toast" id="toast"></div>
    <script type="module" src="/assets/starfield.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
