    <div class="app-shell">
      <div class="app-layout" id="app-layout" data-entry="work">
        <aside class="conversation-sidebar" id="conversation-sidebar" aria-label="工作与观测">
          <div class="sidebar-header">
            <div class="brand-lockup">
              <svg class="brand-symbol" role="img" aria-label="Formicand">
                <use href="#i-formicand-mark" />
              </svg>
              <strong>Formicand</strong>
            </div>
            <div class="sidebar-header-actions">
              <button
                class="sidebar-icon"
                title="搜索"
                aria-label="搜索"
                aria-haspopup="dialog"
                aria-keyshortcuts="Control+P Meta+P"
              >
                <svg class="ui-icon"><use href="#i-search" /></svg>
              </button>
            </div>
          </div>
          <div class="entry-switch ui-segmented" role="tablist" aria-label="入口">
            <button
              class="entry-switch-option"
              type="button"
              role="tab"
              id="entry-work"
              data-entry-mode="work"
              aria-label="工作"
              aria-selected="true"
              aria-controls="work-entry"
              tabindex="0"
            >
              <svg class="ui-icon" aria-hidden="true"><use href="#i-chat" /></svg><span>工作</span>
            </button>
            <button
              class="entry-switch-option"
              type="button"
              role="tab"
              id="entry-observe"
              data-entry-mode="observe"
              aria-label="观测"
              aria-selected="false"
              aria-controls="observe-entry"
              tabindex="-1"
            >
              <svg class="ui-icon" aria-hidden="true"><use href="#i-radar" /></svg><span>观测</span>
            </button>
          </div>
          <div class="work-sidebar" data-entry-panel="work">
            <div class="sidebar-top">
              <button class="new-conversation" id="new-conversation" aria-label="新会话" disabled>
                <span class="new-icon"
                  ><svg class="ui-icon"><use href="#i-plus" /></svg></span
                ><span class="new-label">新会话</span><kbd class="shortcut">⌘K</kbd>
              </button>
            </div>
            <div class="sidebar-section-label">
              <span class="sidebar-section-title">项目 <span id="conversation-count" hidden>0</span></span
              ><button id="new-project" type="button" aria-label="添加项目" title="添加项目">
                <svg class="ui-icon"><use href="#i-plus" /></svg>
              </button>
            </div>
            <div class="project-list" id="project-list" aria-label="项目、Main 会话与子 Agent"></div>
            <nav class="sidebar-nav sidebar-legacy" aria-label="工具">
              <button
                class="nav-item"
                id="ledger-nav"
                type="button"
                aria-haspopup="dialog"
                aria-label="需求台账"
              >
                <span class="nav-icon"
                  ><svg class="ui-icon" aria-hidden="true"><use href="#i-file" /></svg></span
                ><span>需求台账</span>
              </button>
              <button
                class="nav-item"
                id="development-nav"
                type="button"
                aria-haspopup="dialog"
                aria-label="需求现场"
              >
                <span class="nav-icon"
                  ><svg class="ui-icon" aria-hidden="true"><use href="#i-code" /></svg></span
                ><span>需求现场</span>
              </button>
              <button
                class="nav-item"
                id="main-sessions-nav"
                type="button"
                aria-haspopup="dialog"
                aria-label="Main 会话"
              >
                <span class="nav-icon"
                  ><svg class="ui-icon" aria-hidden="true"><use href="#i-chat" /></svg></span
                ><span>Main 会话</span>
              </button>
              <button
                class="nav-item"
                id="main-capacity-nav"
                type="button"
                aria-haspopup="dialog"
                aria-label="外部容量"
              >
                <span class="nav-icon"
                  ><svg class="ui-icon" aria-hidden="true"><use href="#i-activity" /></svg></span
                ><span>外部容量</span>
              </button>
              <button
                class="nav-item"
                id="board-nav"
                type="button"
                aria-haspopup="dialog"
                aria-label="需求看板"
              >
                <span class="nav-icon"
                  ><svg class="ui-icon" aria-hidden="true"><use href="#i-grid" /></svg></span
                ><span>需求看板</span>
              </button>
            </nav>
          </div>
          <nav class="observe-nav" data-entry-panel="observe" aria-label="观测视图" hidden>
            <button
              class="nav-item"
              type="button"
              data-observe-view="overview"
              aria-label="总览"
              aria-current="page"
            >
              <span class="nav-icon"
                ><svg class="ui-icon" aria-hidden="true"><use href="#i-grid" /></svg></span
              ><span>总览</span>
            </button>
            <button class="nav-item" type="button" data-observe-view="requirements" aria-label="需求">
              <span class="nav-icon"
                ><svg class="ui-icon" aria-hidden="true"><use href="#i-list-checks" /></svg></span
              ><span>需求</span>
            </button>
            <button class="nav-item" type="button" data-observe-view="runs" aria-label="运行">
              <span class="nav-icon"
                ><svg class="ui-icon" aria-hidden="true"><use href="#i-activity" /></svg></span
              ><span>运行</span>
            </button>
          </nav>
          <div class="sidebar-bottom">
            <button class="account-row" id="recover-drafts" type="button" hidden>恢复草稿</button>
            <button

              id="user-menu-button"
              aria-label="设置"
              aria-haspopup="dialog"
              aria-controls="profile-modal"
            >
              <svg class="ui-icon account-icon" aria-hidden="true"><use href="#i-settings" /></svg
              ><span class="account-name">设置</span>
            </button>
          </div>
        </aside>

        <div
          class="sidebar-divider"
          id="sidebar-divider"
          role="separator"
          tabindex="0"
          aria-label="调整会话侧栏宽度"
          aria-orientation="vertical"
          title="拖动调整侧栏宽度，双击恢复默认"
        ></div>
        <main class="chat-pane" id="work-entry" data-entry-panel="work">
          <header class="session-header">
            <h1 class="session-title" id="topbar-task">新任务</h1>
            <div class="session-header-actions">
              <button
                class="session-header-button"
                id="session-menu-button"
                type="button"
                title="会话菜单"
                aria-label="会话菜单"
                aria-haspopup="menu"
                aria-controls="session-menu"
                aria-expanded="false"
                hidden
              >
                <svg class="ui-icon" aria-hidden="true"><use href="#i-more" /></svg>
              </button>
              <button
                class="session-header-button"
                id="output-pane-toggle"
                type="button"
                title="切换任务面板"
                aria-label="切换任务面板"
                aria-controls="agent-pane"
                aria-expanded="false"
              >
                <svg class="ui-icon" aria-hidden="true"><use href="#i-panel-right" /></svg>
              </button>
            </div>
          </header>
          <div class="chat-body">
            <div id="workbench" class="workbench" hidden>
              <div
                class="workbench-header"
                data-workbench-header
                aria-describedby="workbench-session-status"
                hidden
              >
                <nav class="workbench-rail" data-tab-rail aria-label="打开的文件与应用" hidden></nav>
                <span id="workbench-session-status" class="sr-only" data-app-task-status role="status"></span>
                <div class="workbench-view-actions">
                  <button class="app-button" data-app-expand aria-label="全屏编辑" title="全屏编辑">
                    <svg class="ui-icon" aria-hidden="true"><use href="#i-fit" /></svg>
                  </button>
                  <button
                    class="app-button"
                    data-app-collaborate
                    aria-label="在对话中使用"
                    title="在对话中使用"
                  >
                    <svg class="ui-icon" aria-hidden="true"><use href="#i-chat" /></svg>
                  </button>
                </div>
              </div>
              <div class="workbench-tabs" data-tab-strip role="tablist" aria-label="工作台标签"></div>
            </div>
            <div
              class="workspace-divider"
              data-workspace-divider
              role="separator"
              aria-label="调整对话与工作台宽度"
              aria-orientation="vertical"
              tabindex="0"
              hidden
            ></div>
            <div id="conversation-pane" class="conversation-pane">
              <section class="chat-scroll" id="conversation">
                <div class="welcome-empty">
                  <div class="welcome-symbol">
                    <svg class="welcome-mark" aria-hidden="true"><use href="#i-formicand-mark" /></svg>
                  </div>
                  <h2>有什么可以帮忙的？</h2>
                </div>
              </section>
              <div class="composer-wrap">
                <section
                  id="human-questions"
                  class="human-questions"
                  aria-label="需要你的回复"
                  hidden
                ></section>
                <div class="composer">
                  <div id="queued-messages" class="queued-messages" aria-label="排队消息" hidden></div>
                  <button class="composer-context" data-composer-context type="button" hidden></button>
                  <textarea
                    id="composer-input"
                    rows="3"
                    aria-label="任务描述"
                    placeholder="描述任务，或添加后续要求…"
                  ></textarea>
                  <div id="upload-status" class="upload-status" role="status" hidden></div>
                  <div id="attachment-strip" class="attachment-strip" hidden></div>
                  <div class="composer-bar">
                    <div class="composer-left">
                      <button
                        class="attach-button"
                        title="添加文件 · 支持图片、PDF、Office，也可拖拽或粘贴截图"
                        aria-label="添加文件"
                      >
                        <svg class="ui-icon"><use href="#i-plus" /></svg>
                      </button>
                      <button
                        class="composer-project"
                        id="composer-project"
                        type="button"
                        title="选择会话所在的项目"
                        aria-label="选择项目"
                        aria-haspopup="listbox"
                        aria-expanded="false"
                        hidden
                      >
                        <svg class="ui-icon" aria-hidden="true"><use href="#i-folder-open" /></svg
                        ><span class="composer-project-name"></span
                        ><span class="model-chevron"
                          ><svg class="ui-icon" aria-hidden="true"><use href="#i-chevron-down" /></svg
                        ></span>
                      </button>
                      <button id="model-setup-button" type="button" hidden>连接模型</button>
                      <button
                        class="model-select"
                        id="model-select"
                        type="button"
                        title="切换模型"
                        aria-haspopup="listbox"
                        aria-expanded="false"
                      >
                        <span class="model-logo"
                          ><svg class="brand-symbol" aria-hidden="true">
                            <use href="#i-formicand-mark-small" /></svg
                        ></span>
                        <span class="model-name">Formicand Main</span
                        ><span class="model-chevron"
                          ><svg class="ui-icon" aria-hidden="true"><use href="#i-chevron-down" /></svg
                        ></span>
                      </button>
                      <button
                        class="reasoning-select"
                        id="reasoning-select"
                        type="button"
                        title="设置推理强度"
                        aria-label="推理强度：自动"
                        aria-haspopup="listbox"
                        aria-expanded="false"
                      >
                        <span class="reasoning-name">自动</span
                        ><span class="model-chevron"
                          ><svg class="ui-icon" aria-hidden="true"><use href="#i-chevron-down" /></svg
                        ></span>
                      </button>
                    </div>
                    <div class="composer-right">
                      <button
                        class="app-bind-select"
                        id="app-bind-select"
                        type="button"
                        title="指定本轮对话加载的应用"
                        aria-label="加载应用"
                        aria-haspopup="listbox"
                        aria-expanded="false"
                        hidden
                      >
                        <span class="app-bind-icon"
                          ><svg class="ui-icon"><use href="#i-apps" /></svg></span
                        ><span class="app-bind-name">未加载应用</span
                        ><span class="model-chevron"
                          ><svg class="ui-icon" aria-hidden="true"><use href="#i-chevron-down" /></svg
                        ></span>
                      </button>
                      <button
                        id="stop-button"
                        class="stop-button"
                        type="button"
                        aria-label="停止任务"
                        title="停止任务"
                        hidden
                      >
                        <svg class="ui-icon" aria-hidden="true"><use href="#i-stop" /></svg>
                      </button>
                      <button id="send-button" class="send-button" aria-label="发送">
                        <svg class="ui-icon"><use href="#i-send" /></svg>
                      </button>
                    </div>
                    <div class="model-menu" id="model-menu" role="listbox" aria-label="可用模型" hidden></div>
                    <div
                      class="model-menu reasoning-menu"
                      id="reasoning-menu"
                      role="listbox"
                      aria-label="推理强度"
                      hidden
                    ></div>
                    <div
                      class="model-menu app-bind-menu"
                      id="app-bind-menu"
                      role="listbox"
                      aria-label="可加载的应用"
                      hidden
                    ></div>
                  </div>
                  <div
                    class="model-menu composer-project-menu"
                    id="composer-project-menu"
                    role="listbox"
                    aria-label="会话项目"
                    hidden
                  ></div>
                </div>
              </div>
            </div>
          </div>
        </main>
        <section
          class="observe-pane"
          id="observe-entry"
          data-entry-panel="observe"
          aria-labelledby="observe-title"
          hidden
        >
          <header class="observe-header">
            <h1 id="observe-title" tabindex="-1">总览</h1>
          </header>
          <div class="observe-body">
            <section class="observe-view" data-observe-panel="overview"></section>
            <section class="observe-view" data-observe-panel="requirements" hidden></section>
            <section class="observe-view" data-observe-panel="runs" hidden></section>
          </div>
        </section>

        <aside class="agent-pane" id="agent-pane" aria-label="任务工作空间">
          <div class="agent-pane-header">
            <div class="output-heading">
              <h2 id="panel-heading" tabindex="-1" aria-label="任务面板">
                <span data-panel-title>任务面板</span>
                <button
                  class="sidebar-view-toggle"
                  data-sidebar-view="navigation"
                  title="显示默认侧栏"
                  aria-label="显示默认侧栏"
                  aria-controls="conversation-sidebar"
                  hidden
                >
                  <span>任务面板</span>
                  <svg class="ui-icon" aria-hidden="true"><use href="#i-switch" /></svg>
                </button>
              </h2>
              <span id="agent-count" hidden>0</span
              ><button class="panel-add" aria-label="刷新任务面板" title="刷新">
                <svg class="ui-icon"><use href="#i-refresh" /></svg>
              </button>
            </div>
          </div>
          <div id="workspace-view" class="panel-view workspace-view">
            <div class="workspace-start">
              <strong>从一个任务或文档开始</strong>
              <p>先在输入框准备任务，或打开应用编辑文档。运行任务前，连接模型并选择项目文件夹。</p>
              <small>开始协作后，这里会显示产出物和运行用量。</small>
            </div>
            <div class="output-section">
              <div class="output-section-title">
                <span>产出物</span><span id="workspace-artifact-count">0</span>
              </div>
              <div class="output-list" id="output-list"></div>
            </div>
            <div class="detail-heading" id="detail-heading">
              <span>会话运行概览</span><span id="run-statistics-status"></span>
            </div>
            <div class="right-body" id="detail-body"></div>
          </div>
        </aside>
      </div>
    </div>
    <div id="connection-state" role="status" hidden></div>
    <div id="artifact-drawer-scrim" class="artifact-drawer-scrim" hidden></div>
    <aside id="artifact-drawer" class="artifact-drawer" aria-label="产出物详情" hidden></aside>
    <input
      id="file-input"
      type="file"
      accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.docx,.pptx,.xlsx,.txt,.md,.markdown,.csv,.tsv,.json,.jsonl,.yaml,.yml,.xml,.html,.css,.js,.mjs,.cjs,.ts,.tsx,.jsx,.py,.sh,.sql,.log,.ini,.toml,.tex,.svg"
      multiple
      hidden
    />
    <div class="modal-backdrop settings-backdrop" id="profile-modal" hidden>
      <section
        class="modal-card profile-card settings-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="profile-modal-title"
      >
        <header class="settings-heading">
          <div>
            <h2 id="profile-modal-title">设置</h2>
          </div>
          <button
            class="settings-nav-button"
            type="button"
            id="profile-close"
            aria-label="关闭设置"
            title="关闭设置"
          >
            <svg class="ui-icon" aria-hidden="true"><use href="#i-close" /></svg>
          </button>
        </header>
        <div class="settings-scroll settings-overview" id="profile-settings-sections">
          <section class="settings-overview-group" aria-labelledby="settings-general-heading">
            <h3 id="settings-general-heading">通用</h3>
            <div class="settings-overview-rows" id="profile-settings-general">
              <div class="profile-setting appearance-setting">
                <span class="settings-row-copy"
                  ><span class="settings-row-icon"
                    ><svg class="ui-icon" aria-hidden="true"><use href="#i-layout" /></svg></span
                  ><span><label for="appearance-select">外观</label></span></span
                >
                <select id="appearance-select" aria-describedby="appearance-status">
                  <option value="system">跟随系统</option>
                  <option value="dark">深色</option>
                  <option value="light">浅色</option>
                </select>
                <span id="appearance-status" role="status"></span>
              </div>
              <div class="profile-setting appearance-setting">
                <span class="settings-row-copy"
                  ><span class="settings-row-icon"
                    ><svg class="ui-icon" aria-hidden="true"><use href="#i-text" /></svg></span
                  ><span><label for="language-select">语言</label></span></span
                >
                <select id="language-select" aria-describedby="language-status">
                  <option value="zh-CN" lang="zh-CN">简体中文</option>
                  <option value="en" lang="en">English</option>
                </select>
                <span id="language-status" role="status"></span>
              </div>
            </div>
          </section>
          <section class="settings-overview-group" aria-labelledby="settings-connections-heading">
            <h3 id="settings-connections-heading">连接</h3>
            <div class="settings-overview-rows" id="profile-settings-connections"></div>
          </section>
          <section class="settings-overview-group" aria-labelledby="settings-tools-heading">
            <h3 id="settings-tools-heading">工具</h3>
            <div class="settings-overview-rows" id="profile-settings-tools"></div>
          </section>
          <section
            class="settings-overview-group"
            id="settings-about-group"
            aria-labelledby="settings-about-heading"
          >
            <h3 id="settings-about-heading">关于</h3>
            <div class="settings-overview-rows" id="profile-settings-about">
              <div class="desktop-updates">
                <div class="profile-setting about-product">
                  <span class="settings-row-copy"
                    ><span class="settings-row-icon about-mark"
                      ><svg class="brand-symbol" aria-hidden="true">
                        <use href="#i-formicand-mark" /></svg></span
                    ><span><strong>Formicand</strong><small data-update-version hidden></small></span
                  ></span>
                  <button class="about-update" type="button" data-update-action hidden>检查更新</button>
                </div>
                <p data-update-message role="status" aria-live="polite" hidden></p>
                <progress data-update-progress aria-label="更新进度" hidden></progress>
                <p data-update-error role="alert" hidden></p>
              </div>
            </div>
          </section>
        </div>
      </section>
    </div>
    <div class="session-menu" id="session-menu" hidden></div>
    <div class="toast" id="toast"></div>
    <script type="module" src="/assets/starfield.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
