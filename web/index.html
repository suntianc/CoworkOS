        <div class="settings-column">
          <section class="settings-panel is-large" data-settings-panel="general" aria-label="通用">
            <h1 class="settings-page-title">通用</h1>
            <div class="settings-group">
              <div class="settings-group-head"><h2 class="settings-group-title">外观</h2></div>
              <div class="settings-rows">
                <div class="settings-row">
                  <span class="settings-row-label">主题</span>
                  <div class="settings-segmented" role="radiogroup" aria-label="主题" id="appearance-choices">
                    <button type="button" role="radio" data-appearance-value="system" aria-checked="true">
                      跟随系统
                    </button>
                    <button type="button" role="radio" data-appearance-value="light" aria-checked="false">
                      浅色
                    </button>
                    <button type="button" role="radio" data-appearance-value="dark" aria-checked="false">
                      深色
                    </button>
                  </div>
                  <span id="appearance-status" role="status"></span>
                </div>
                <div class="settings-row" id="window-material-row" hidden>
                  <span class="settings-row-label">窗口材质</span>
                  <button
                    class="ui-switch"
                    type="button"
                    role="switch"
                    id="window-material-toggle"
                    aria-checked="true"
                    aria-label="窗口材质"
                  ></button>
                </div>
                <div class="settings-row">
                  <span class="settings-row-label">减少动态效果</span>
                  <div
                    class="settings-segmented"
                    role="radiogroup"
                    aria-label="减少动态效果"
                    id="reduced-motion-choices"
                  >
                    <button type="button" role="radio" data-reduced-motion-value="system" aria-checked="true">
                      跟随系统
                    </button>
                    <button type="button" role="radio" data-reduced-motion-value="on" aria-checked="false">
                      开启
                    </button>
                    <button type="button" role="radio" data-reduced-motion-value="off" aria-checked="false">
                      关闭
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div class="settings-group">
              <div class="settings-group-head"><h2 class="settings-group-title">语言与区域</h2></div>
              <div class="settings-rows">
                <div class="settings-row">
                  <label class="settings-row-label" for="language-select">界面语言</label>
                  <select id="language-select" class="settings-select" aria-describedby="language-status">
                    <option value="zh-CN" lang="zh-CN">简体中文</option>
                    <option value="en" lang="en">English</option>
                  </select>
                  <span id="language-status" role="status"></span>
                </div>
                <div class="settings-row">
                  <span class="settings-row-label">时间格式</span>
                  <div
                    class="settings-segmented"
                    role="radiogroup"
                    aria-label="时间格式"
                    id="time-format-choices"
                  >
                    <button type="button" role="radio" data-time-format-value="relative" aria-checked="true">
                      相对时间
                    </button>
                    <button type="button" role="radio" data-time-format-value="absolute" aria-checked="false">
                      绝对时间
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div class="settings-group">
              <div class="settings-group-head"><h2 class="settings-group-title">关于</h2></div>
              <div class="settings-rows" id="profile-settings-about">
                <div class="desktop-updates">
                  <div class="settings-row about-product">
                    <span class="settings-row-copy"
                      ><span class="about-mark"
                        ><svg class="brand-symbol" aria-hidden="true">
                          <use href="#i-formicand-mark" /></svg></span
                      ><span><strong>Formicand</strong><small data-update-version hidden></small></span
                    ></span>
                    <button class="about-update" type="button" data-update-action hidden>检查更新</button>
                  </div>
                  <p data-update-message role="status" aria-live="polite" hidden></p>
                  <progress data-update-progress aria-label="更新进度" hidden></progress>
                  <p data-update-error role="alert" hidden></p>
                </div>
              </div>
            </div>
          </section>
          <section class="settings-panel" data-settings-panel="nodes" aria-label="节点连接" hidden>
            <h1 class="settings-page-title">节点连接</h1>
            <div class="settings-group">
              <div class="settings-group-head"><h2 class="settings-group-title">本机</h2></div>
              <div class="settings-rows" id="settings-node-local"></div>
            </div>
            <div class="settings-group" id="settings-node-remote-group" hidden>
              <div class="settings-group-head">
                <h2 class="settings-group-title">远程节点</h2>
                <span class="settings-group-spacer"></span>
                <button class="settings-link" type="button" id="settings-node-add" hidden>
                  <svg class="ui-icon" aria-hidden="true"><use href="#i-plus" /></svg><span>添加节点</span>
                </button>
              </div>
              <div class="settings-rows" id="settings-node-remote"></div>
            </div>
            <div class="settings-group">
              <div class="settings-group-head"><h2 class="settings-group-title">项目数据</h2></div>
              <div class="settings-rows" id="settings-node-data"></div>
            </div>
          </section>
          <section class="settings-panel" data-settings-panel="models" aria-label="模型与角色" hidden>
            <h1 class="settings-page-title">模型与角色</h1>
            <div class="settings-group">
              <div class="settings-group-head">
                <h2 class="settings-group-title">模型连接</h2>
                <span class="settings-group-spacer"></span>
                <button class="settings-link" type="button" id="settings-model-add">
                  <svg class="ui-icon" aria-hidden="true"><use href="#i-plus" /></svg><span>添加连接</span>
                </button>
              </div>
              <div class="settings-rows" id="profile-settings-connections"></div>
            </div>
            <div class="settings-group">
              <div class="settings-group-head">
                <h2 class="settings-group-title">角色</h2>
                <span class="settings-group-spacer"></span>
              </div>
              <div class="settings-rows" id="settings-role-rows"></div>
            </div>
          </section>
          <section class="settings-panel" data-settings-panel="capacity" aria-label="运行名额" hidden>
            <div class="settings-title-row">
              <h1 class="settings-page-title">运行名额</h1>
              <span class="settings-info" title="本机不配置名额；只对远程对外节点设置常驻与接续数量"
                ><svg class="ui-icon" aria-hidden="true"><use href="#i-info" /></svg
              ></span>
            </div>
            <div id="settings-capacity-nodes"></div>
          </section>
          <section class="settings-panel" data-settings-panel="members" aria-label="成员与通道" hidden>
            <h1 class="settings-page-title">成员与通道</h1>
            <div class="settings-group">
              <div class="settings-group-head"><h2 class="settings-group-title">成员</h2></div>
              <div class="settings-rows" id="settings-member-rows"></div>
            </div>
            <div class="settings-group is-placeholder">
              <div class="settings-group-head">
                <h2 class="settings-group-title">通知通道</h2>
                <span class="settings-phase">P5 开放</span>
                <span class="settings-group-spacer"></span>
              </div>
              <div class="settings-rows">
                <div class="settings-row">
                  <span class="settings-icon-box"
                    ><svg class="ui-icon" aria-hidden="true"><use href="#i-chat" /></svg
                  ></span>
                  <span class="settings-row-text"><span class="settings-row-name">飞书</span></span>
                  <span class="settings-row-spacer"></span>
                  <button class="settings-outline-button" type="button" disabled>连接</button>
                </div>
                <div class="settings-row">
                  <span class="settings-icon-box"
                    ><svg class="ui-icon" aria-hidden="true"><use href="#i-messages-square" /></svg
                  ></span>
                  <span class="settings-row-text"><span class="settings-row-name">企业微信</span></span>
                  <span class="settings-row-spacer"></span>
                  <button class="settings-outline-button" type="button" disabled>连接</button>
                </div>
                <div class="settings-row">
                  <span class="settings-icon-box"
                    ><svg class="ui-icon" aria-hidden="true"><use href="#i-send" /></svg
                  ></span>
                  <span class="settings-row-text"><span class="settings-row-name">Telegram</span></span>
                  <span class="settings-row-spacer"></span>
                  <button class="settings-outline-button" type="button" disabled>连接</button>
                </div>
              </div>
            </div>
            <div class="settings-group is-placeholder">
              <div class="settings-group-head">
                <h2 class="settings-group-title">回访</h2>
                <span class="settings-phase">P5 开放</span>
                <span class="settings-group-spacer"></span>
              </div>
              <div class="settings-rows">
                <div class="settings-row">
                  <span class="settings-row-label">回访间隔</span>
                  <span class="settings-row-spacer"></span>
                  <select class="settings-select is-narrow" aria-label="回访间隔" disabled>
                    <option>每 1 天</option>
                  </select>
                </div>
                <div class="settings-row">
                  <span class="settings-row-label">3 次无回复后通知</span>
                  <span class="settings-info" title="三次回访都没有回复时提醒项目负责人"
                    ><svg class="ui-icon" aria-hidden="true"><use href="#i-info" /></svg
                  ></span>
                  <span class="settings-row-spacer"></span>
                  <span class="settings-row-state">项目负责人</span>
                </div>
              </div>
            </div>
          </section>
          <section class="settings-panel is-large" data-settings-panel="tools" aria-label="工具" hidden>
            <h1 class="settings-page-title">工具</h1>
            <div class="settings-group">
              <div class="settings-group-head"><h2 class="settings-group-title">内置工具</h2></div>
              <div class="settings-rows" id="profile-settings-tools"></div>
            </div>
            <div class="settings-group" id="settings-mcp-group" hidden>
              <div class="settings-group-head">
                <h2 class="settings-group-title">MCP 服务</h2>
                <span class="settings-group-spacer"></span>
                <button class="settings-link" type="button" id="settings-mcp-add" hidden>
                  <svg class="ui-icon" aria-hidden="true"><use href="#i-plus" /></svg><span>添加服务</span>
                </button>
              </div>
              <div class="settings-rows" id="settings-mcp-rows"></div>
            </div>
          </section>
        </div>
      </div>
    </section>
    <div class="session-menu" id="session-menu" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
